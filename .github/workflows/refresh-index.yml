name: Refresh experiment index
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
permissions:
  contents: write
concurrency:
  group: experiment-index
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Fetch machine catalogs
        run: git fetch --filter=blob:none --depth=1 origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Generate index
        run: python scripts/refresh_index.py
      - name: Commit index
        run: |
          git add README.md
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'docs: refresh experiment index'
          git push origin HEAD:main
