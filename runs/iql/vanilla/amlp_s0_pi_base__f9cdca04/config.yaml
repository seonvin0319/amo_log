# Vanilla IQL (pi_base / Actor0 extracted from MPI-IQL).
# Multi-actor W2/FB fields were dropped; Actor0 update matches standalone IQL.
algo: iql
family: vanilla
extracted_from: mpi_iql_actor0
env: antmaze-large-play-v2
seed: 0
eval_freq: 5000
n_episodes: 10
max_timesteps: 1000000
iql_tau: 0.9
beta: 10.0
vf_lr: 0.0003
qf_lr: 0.0003
actor_lr: 0.0003
batch_size: 256
discount: 0.99
tau: 0.005
buffer_size: 1000000
normalize: true
normalize_reward: true
final_eval_runs: 1
final_eval_episodes: 100
project: PORL
group: iql-fb-antmaze
name: antmaze-large-play-v2-iql-fb
